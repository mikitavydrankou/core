services:
  backend:
    build: ./app
    container_name: taxi_backend
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:secret@db:5432/taxi
      - REDIS_URL=redis://redis:6379/0

  db:
    image: postgres:16
    container_name: taxi_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: taxi
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: taxi_redis

volumes:
  postgres_data:
