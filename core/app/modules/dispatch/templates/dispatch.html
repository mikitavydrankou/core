<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dispatcher Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --panel: rgba(16, 26, 45, 0.92);
        --border: rgba(148, 163, 184, 0.18);
        --text: #e7eefc;
        --muted: #94a3b8;
        --accent: #63e6be;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #07111f 0%, #0b1424 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 100vh;
      }

      aside {
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.5;
      }

      .status {
        margin-bottom: 16px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--muted);
        font-size: 14px;
      }

      .driver-list {
        display: grid;
        gap: 10px;
      }

      .driver-card {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        padding: 12px;
      }

      .driver-name {
        font-weight: 700;
        margin-bottom: 4px;
      }

      .driver-meta {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.45;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(99, 230, 190, 0.12);
        color: #92f2d0;
      }

      #map {
        width: 100%;
        height: 100vh;
      }

      .empty {
        color: var(--muted);
        font-size: 14px;
        padding: 12px 0;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        #map {
          height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <h1>Dispatcher</h1>
        <p>Карта показывает водителей, которые сейчас отправляют координаты в WebSocket.</p>
        <div class="status" id="status">Connecting to live updates...</div>
        <div class="driver-list" id="driverList"></div>
      </aside>
      <main id="map"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const statusEl = document.getElementById("status");
      const driverList = document.getElementById("driverList");
      const map = L.map("map").setView([53.9, 27.56], 11);
      const markers = new Map();
      const drivers = new Map();
      const lastSeen = new Map();
      const staleAfterMs = 12000;

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      function toStyle(status, stale) {
        if (stale) {
          return "#94a3b8";
        }
        if (status === "busy") {
          return "#ff8a65";
        }
        return "#63e6be";
      }

      function markerIcon(color) {
        return L.divIcon({
          className: "",
          html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 0 0 4px rgba(0,0,0,0.18);"></div>`,
          iconSize: [22, 22],
          iconAnchor: [11, 11],
        });
      }

      function renderDrivers() {
        const entries = Array.from(drivers.values());
        if (!entries.length) {
          driverList.innerHTML = '<div class="empty">Сейчас нет онлайн водителей. Запусти симулятор или Telegram mini app.</div>';
          statusEl.textContent = "No online drivers";
          return;
        }

        statusEl.textContent = `Online: ${entries.length}`;
        driverList.innerHTML = entries
          .map((driver) => {
            return `
              <div class="driver-card">
                <div class="driver-name">Driver ${driver.driverId}</div>
                <div class="driver-meta">Lat: ${Number(driver.lat).toFixed(5)}<br/>Lng: ${Number(driver.lng).toFixed(5)}<br/>Updated: ${driver.updatedAt}</div>
                <div class="badge">online</div>
              </div>
            `;
          })
          .join("");
      }

      function updateDriver(driver) {
        drivers.set(driver.driverId, driver);
        lastSeen.set(driver.driverId, Date.parse(driver.updatedAt) || Date.now());

        const color = toStyle(driver.status, false);
        const latLng = [driver.lat, driver.lng];

        if (!markers.has(driver.driverId)) {
          markers.set(
            driver.driverId,
            L.marker(latLng, { icon: markerIcon(color) })
              .addTo(map)
              .bindPopup(`Driver ${driver.driverId}`)
          );
        } else {
          const marker = markers.get(driver.driverId);
          marker.setLatLng(latLng);
          marker.setIcon(markerIcon(color));
        }

        renderDrivers();
      }

      function pruneDrivers() {
        const now = Date.now();
        for (const [driverId, seenAt] of lastSeen.entries()) {
          if (now - seenAt <= staleAfterMs) {
            continue;
          }

          lastSeen.delete(driverId);
          drivers.delete(driverId);
          const marker = markers.get(driverId);
          if (marker) {
            map.removeLayer(marker);
            markers.delete(driverId);
          }
        }
        renderDrivers();
      }

      const wsProtocol = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${wsProtocol}://${location.host}/ws`);

      ws.addEventListener("open", () => {
        statusEl.textContent = "Live updates connected";
      });

      ws.addEventListener("close", () => {
        statusEl.textContent = "Live updates disconnected";
      });

      ws.addEventListener("error", () => {
        statusEl.textContent = "WebSocket error";
      });

      ws.addEventListener("message", (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type !== "driver_location") {
            return;
          }
          updateDriver(data);
        } catch (error) {
          return;
        }
      });

      renderDrivers();
      setInterval(pruneDrivers, 1000);
    </script>
  </body>
</html>
